name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.13.5'
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: '155.0.8059.80'
      - name: Install locked dependencies
        run: dart pub get --enforce-lockfile
      - name: Build web examples and test bootstraps
        run: dart run build_runner build --output=example:build/example
      - name: Analyze
        run: dart analyze
      - name: Test
        run: dart test -P all
        env:
          CHROME_EXECUTABLE: ${{ steps.chrome.outputs.chrome-path }}
      - name: Verify regression detection
        run: dart run tool/goldens.dart --self-check
        env:
          CHROME_EXECUTABLE: ${{ steps.chrome.outputs.chrome-path }}
      - name: Upload failure images
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: build/golden_failures/
          if-no-files-found: ignore
          retention-days: 14
