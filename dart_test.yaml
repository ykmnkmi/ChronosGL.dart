define_platforms:
  golden_chrome:
    name: Chrome with SwiftShader
    extends: chrome
    settings:
      arguments: >-
        --use-gl=angle
        --use-angle=swiftshader
        --enable-unsafe-swiftshader
        --autoplay-policy=no-user-gesture-required

presets:
  goldens:
    platforms: [golden_chrome]
    paths: [test/render_golden_test.dart, test/golden_comparison_test.dart]
    concurrency: 1
    timeout: 60s
  all:
    platforms: [vm, golden_chrome]
    paths:
      - test/polygon.dart
      - test/geometry.dart
      - test/grid_geometry_test.dart
      - test/shader_syntax.dart
      - test/show_extensions.dart
      - test/render_golden_test.dart
      - test/golden_comparison_test.dart
      - test/type_boundaries_test.dart
      - test/legacy_dom_compatibility_test.dart
      - test/core_web_interop_test.dart
      - test/camera_position_reproduction_test.dart
      - test/orbit_frame_rate_reproduction_test.dart
      - test/shared_settings_reproduction_test.dart
      - test/render_program_uniforms_test.dart
      - test/scene_uniforms_test.dart
      - test/webhelper_interop_test.dart
    concurrency: 1
    timeout: 60s
